name: Home
description: A dashboard composed from reusable Surface, Navigation Item, Avatar, Progress Bar, Text Field, Divider,
  Label, and Button materials.
note: Each visual is a separate, absolutely positioned Material placement.
preview-states:
  - id: default
    name: Dashboard
  - id: add-item-open
    name: Add item dialog open
    description: Show the Add item dialog assembled from individual materials.
spec: screens/home/specs/screen.md
layers:
  - id: base
    name: Base
