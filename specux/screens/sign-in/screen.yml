name: Sign In
description: A sign-in screen composed from reusable Surface, Avatar, Text Field, Checkbox, Divider, Label, and Button materials.
note: Static preview only; fields are visual Materials and do not collect or submit credentials.
layers:
  - id: base
    name: Base
materials:
  - id: signin-background
    layer: base
    src: materials/surface.stml
    attributes:
      background: "#f8f9fc"
      border: none
      border-radius: 0
      shadow: none
    position:
      x: 0
      y: 0
    size:
      width: 1360
      height: 900
    rotation: 0
  - id: brand-story-panel
    layer: base
    src: materials/surface.stml
    attributes:
      background: "linear-gradient(145deg, #18254e, #263d78 62%, #3151a0)"
