      border-radius: 0
      shadow: none
    position:
      x: 0
      y: 0
    size:
      width: 680
      height: 900
    rotation: 0
  - id: signin-brand-mark
    layer: base
    src: materials/avatar.stml
    attributes:
      initials: N
      color: "#1e315f"
      background: "#ffffff"
      border-radius: 11
      font-size: 18
      font-weight: 800
    position:
      x: 72
      y: 52
    size:
      width: 38
      height: 38
    rotation: 0
  - id: signin-brand-name
